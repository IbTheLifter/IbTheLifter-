    --accent:#f2b705;
    --accent-ink:#1a1500;
    --danger:#e0524a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  body[dir="rtl"]{
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  }
  .wrap{max-width:480px;margin:0 auto;padding:32px 20px 80px;}
  .brand-row{display:flex;align-items:center;gap:12px;}
  .brand-logo{width:48px;height:48px;border-radius:50%;flex:0 0 auto;object-fit:cover;}
  h1{
    font-size:20px;
    font-weight:900;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin:0;
  }
  .sub{color:var(--text-muted);font-size:13px;margin-top:4px;}
  .row{display:flex;gap:8px;}
  input[type="text"], input[type="number"], input[type="password"], input[type="email"], input[type="tel"]{
    background:var(--surface-raised);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    font-size:14px;
    outline:none;
    width:100%;
  }
  input:focus{border-color:var(--accent);}
  .pw-wrap{position:relative;}
  .pw-wrap input{width:100%;padding-inline-end:40px;}
  .pw-eye{
    position:absolute;inset-inline-end:2px;top:50%;transform:translateY(-50%);
    background:none;border:none;cursor:pointer;font-size:16px;padding:8px;
    color:var(--text-muted);line-height:1;
  }
  .btn-unit-toggle {
    background: var(--surface-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    font-weight: bold;
    color: var(--text);
    cursor: pointer;
  }
  .personal-btn{
    flex:1;background:var(--surface-raised);border:1px solid var(--line);
    color:var(--text);border-radius:12px;padding:16px 10px;font-size:14px;font-weight:800;
    text-align:center;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.04em;
    border-radius:10px;
    padding:12px 18px;
    font-size:13px;
  }
  .btn-primary:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-ghost{
    background:transparent;
    color:var(--text-muted);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    text-transform:uppercase;
  }
  .btn-ghost.active{color:var(--accent);border-color:var(--accent);}
  .btn-danger{background:none;color:var(--danger);font-size:14px;}
  .preset-btn{
    display:block;width:100%;text-align:inherit;
    background:var(--surface);border:1px solid var(--line);
    color:var(--text);border-radius:10px;padding:14px 16px;
    font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:0.03em;
    margin-bottom:10px;
  }
  .preset-btn:hover{border-color:var(--accent);}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    margin-bottom:12px;
  }
  .card-head{
    width:100%;
    background:none;
    color:var(--text);
    text-align:inherit;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .card-head-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;position:relative;}
  .muted{color:var(--text-muted);font-size:12px;}
  .card-body{padding:0 16px 16px;}
  .bar-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;background:var(--text-muted);transition:width .2s ease;}
  .bar-fill.pr{background:var(--accent);}
  .pr-label{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.04em;margin-top:4px;}
  .day-tabs{display:flex;gap:8px;overflow-x:auto;margin:22px 0 18px;padding-bottom:4px;}
  .day-tab{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 16px;
    border-radius:99px;
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .day-tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .set-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .set-num{width:22px;color:var(--text-muted);font-size:12px;text-align:center;flex:0 0 auto;}
  .top-actions{display:flex;gap:8px;align-items:center;}
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .empty{color:var(--text-muted);font-size:13px;text-align:center;padding:32px 0;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:14px;
  }
  .list-item.dragging{box-shadow:0 6px 16px rgba(0,0,0,.3);position:relative;}
  .list-item-name{flex:1;margin:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drag-handle{
    cursor:grab;touch-action:none;user-select:none;flex:0 0 auto;
    color:var(--text-muted);font-size:18px;line-height:1;padding:6px 4px;
  }
  .exercise-line{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;font-size:13px;color:var(--text-muted);}
  .footer-note{color:var(--text-muted);font-size:11px;text-align:center;margin-top:40px;}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  .streak-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:13px;font-weight:700;}
  .streak-fire{font-size:16px;}
  .streak-count{color:var(--accent);}
  .chart-wrap{height:110px;padding:4px 16px 10px;}
  .rest-row{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .rest-row input{width:48px;flex:0 0 auto;text-align:center;padding:10px 6px;}
  .rest-display{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;min-width:50px;text-align:center;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px;}
  .stat-row{display:flex;justify-content:space-between;gap:12px;}
  .stat-value{font-size:22px;font-weight:800;margin-top:2px;}
  .stat-change{margin-top:16px;font-size:15px;font-weight:800;}
  .stat-change.up{color:var(--accent);}
  .stat-change.down{color:var(--danger);}
  .confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
  .confetti-piece{position:absolute;top:-10px;width:8px;height:14px;opacity:0.9;animation:confetti-fall 1.2s ease-in forwards;}
  @keyframes confetti-fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
  }
  .ac-list{position:absolute;top:100%;left:0;right:0;background:var(--surface-raised);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:180px;overflow-y:auto;z-index:50;display:none;}
  .ac-item{padding:10px 12px;font-size:14px;cursor:pointer;}
  .ac-item:hover, .ac-item:active{background:var(--surface);color:var(--accent);}
</style>

  var syncChain = Promise.resolve();

  async function persist(next){
    data = next;
    var ok = await storageSet(STORAGE_KEY, JSON.stringify(next));
    render();
    if (!ok){
      var err = document.getElementById("save-err");
      if (err) err.style.display = "block";
    }
    // Chain syncs one at a time. Firing them concurrently (fire-and-forget per edit)
    // let rapid successive edits race on the same stale dataEtag: the second request
    // would 409 against the etag the first one just produced, and the conflict handler
    // would then overwrite local data with the server's (only the first edit),
    // silently discarding the second. Serializing means each sync always uses the
    // etag the previous one just produced.
    if (authToken){
      syncChain = syncChain.then(function(){ return syncToServer(next); });
    }
  }

  // Distinguishes "the token is genuinely invalid/expired" (401 - real logout) from
  // "couldn't reach the server this time" (network hiccup - must NOT log the user out
  // or discard their data, just means we couldn't check for updates right now).
  async function fetchServerData(){
    try {
      var res = await apiFetch("/api/data", {
        method: "GET",
        headers: { "Authorization": "Bearer " + authToken }
      });
      if (res.status === 401) return { unauthorized: true };
      if (!res.ok) return null;
      var body = await res.json();
      // Self-heal: sessions that logged in before Personal Details existed (or that
      // never re-logged-in since) have no cached identity locally. If the server has
      // since learned it (backfilled on some login), adopt and cache it here too.
      if (body.identifier && (!identity || identity.value !== body.identifier)){
        identity = { type: body.identifierType, value: body.identifier };
        try { localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity)); } catch(e){}
      }
      if (body.fullName !== undefined && body.fullName !== null) {
        displayName = body.fullName || "";
        try { localStorage.setItem(DISPLAY_NAME_KEY, displayName); } catch(e){}
      }
      return { data: body.data, etag: body.etag };
    } catch(e){ return null; }
  }

  async function syncToServer(next){
    try {
      var res = await apiFetch("/api/data", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
        body: JSON.stringify({ data: next, etag: dataEtag })
      });
      if (res.status === 409){
        var fresh = await fetchServerData();
        if (fresh){
          data = fresh.data;
          dataEtag = fresh.etag;
          storageSet(STORAGE_KEY, JSON.stringify(fresh.data));
          ui.authError = T("errConflict");
          render();
        }
        return;
      }
      if (res.ok){
        var body = await res.json();
        dataEtag = body.etag;
      }
    } catch(e){ /* offline: localStorage already has the update; next successful sync will catch up */ }
  }

  // In-app browsers (Instagram/Facebook WebViews especially) frequently cannot handle
  // blob-URL file downloads at all - the link just fails to load instead of downloading.
  // Try the native share sheet first (works via the OS, not the WebView's own download
  // manager), and fall back to a plain select-and-copy screen otherwise.
  window.exportLocalData = async function(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var filename = "ibthelifter-backup-" + todayKey() + ".json";

    if (typeof navigator !== "undefined" && navigator.canShare){
      try {
        var file = new File([raw], filename, { type: "application/json" });
        if (navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file], title: filename });
          return;
        }
      } catch(e){ /* user cancelled, or share failed - fall through to text fallback */ }
    }

    showExportTextFallback(raw);
  };

  window.submitAuth = async function(){
    var emailInput = document.getElementById("auth-email");
    var phoneCountry = document.getElementById("auth-phone-country");
    var phoneNumber = document.getElementById("auth-phone-number");
    var passwordInput = document.getElementById("auth-password");

    var identifierType = ui.authIdentifierType;
    var identifier;
    if (identifierType === "email"){
      identifier = emailInput ? emailInput.value.trim() : "";
    } else {
      var dial = phoneCountry ? phoneCountry.value : "";
      var num = phoneNumber ? phoneNumber.value.trim() : "";
      identifier = (dial && num) ? (dial + num) : "";
    }
    var password = passwordInput ? passwordInput.value : "";

    if (!identifier || !password || password.length < 6){
      ui.authError = T("errInvalidInput");
      render();
      return;
    }

    ui.authBusy = true;
    ui.authError = null;
    render();

    var fullNameInput = document.getElementById("auth-fullname");
    var fullNameVal = (fullNameInput ? fullNameInput.value : "") || "";

    var endpoint = ui.authMode === "signup" ? "/api/signup" : "/api/login";
    try {
      var payload = { identifierType: identifierType, identifier: identifier, password: password };
      if (ui.authMode === "signup") payload.fullName = fullNameVal;
      var res = await apiFetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      var body = await res.json().catch(function(){ return {}; });

      if (!res.ok){
        ui.authBusy = false;
        if (body.error === "ACCOUNT_EXISTS") ui.authError = T("errAccountExists");
        else if (body.error === "NO_ACCOUNT") ui.authError = T("errNoAccount");
        else if (body.error === "WRONG_PASSWORD") ui.authError = T("errWrongPassword");
        else if (body.error === "INVALID_INPUT") ui.authError = T("errInvalidInput");
        else ui.authError = T("errGeneric");
        render();
        return;
      }

      authToken = body.token;
      dataEtag = body.etag || null;
      // Prefer the server-normalized identifier (e.g. lowercased email) over the raw
      // typed value, falling back to it only if an older API response omitted it.
      identity = { type: body.identifierType || identifierType, value: body.identifier || identifier };
      displayName = body.fullName || "";
      try {
        localStorage.setItem(TOKEN_KEY, authToken);
        localStorage.setItem(IDENTITY_KEY, JSON.stringify(identity));
        localStorage.setItem(DISPLAY_NAME_KEY, displayName);
      } catch(e){}
      ui.authBusy = false;
      ui.authError = null;

      var serverData = (body.data && body.data.split) ? body.data : null;
      data = serverData;
      if (data){
        storageSet(STORAGE_KEY, JSON.stringify(data));
        ui.activeDayId = data.split.days[0] ? data.split.days[0].id : null;
      }
      ui.stage = data ? "main" : "onboard-choose";
      render();
    } catch(e){
      ui.authBusy = false;
      ui.authError = T("errGeneric");
      render();
    }
  };

  function getHistory(exId){
    var out = [];
    var logs = (data && data.logs) || {};
    Object.keys(logs).forEach(function(date){
      var sets = logs[date].entries && logs[date].entries[exId];
      if (sets && sets.length) out.push({ date: date, sets: sets });
    });
    out.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    return out;
  }
  function volumeOf(sets){
    return sets.reduce(function(sum,s){ return sum + (Number(s.reps)||0) * (Number(s.weight)||0); }, 0);
  }

  function findExercise(exId){
    var found = null;
    (data.split.days || []).forEach(function(d){
      var ex = d.exercises.find(function(e){ return e.id === exId; });
      if (ex) found = ex;
    });
    return found;
  }

  function dayHasSets(dateKey){
    var log = (data && data.logs) ? data.logs[dateKey] : null;
    if (!log || !log.entries) return false;
    return Object.keys(log.entries).some(function(exId){ return log.entries[exId] && log.entries[exId].length > 0; });
  }

  function isRestDay(dateKey){
    var weekday = new Date(dateKey + "T00:00:00").getDay();
    return ((data && data.restDays) || []).indexOf(weekday) !== -1;
  }

  function computeStreak(){
    if (!data) return 0;
    var cursor = new Date(todayKey() + "T00:00:00");
    var todayStr = todayKey();
    if (!dayHasSets(todayStr) && !isRestDay(todayStr)){
      cursor.setDate(cursor.getDate() - 1);
    }
    var streak = 0;
    while (true){
      var key = dateToKey(cursor);
      if (dayHasSets(key)){
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else if (isRestDay(key)){
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function volumeInRange(startDate, endDate){
    var total = 0;
    var logs = (data && data.logs) || {};
    Object.keys(logs).forEach(function(dateStr){
      var d = new Date(dateStr + "T00:00:00");
      if (d >= startDate && d <= endDate){
        var entries = logs[dateStr].entries || {};
        Object.keys(entries).forEach(function(exId){
          total += volumeOf(entries[exId]);
        });
      }
    });
    return total;
  }

  function playRestSound(){

      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      [0, 220, 440].forEach(function(delay){
        setTimeout(function(){
          var o = ctx.createOscillator();
          var g = ctx.createGain();
          o.type = "sine";
          o.frequency.value = 880;
          g.gain.value = 0.18;
          o.connect(g); g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + 0.2);
        }, delay);
      });
      setTimeout(function(){ ctx.close(); }, 800);

  // Committing on every keystroke (oninput) would re-render (and thus recreate) both
  // the minutes and seconds boxes mid-edit, which is exactly what was corrupting values
  // when moving from one box to the other. Debounce so the actual save only happens
  // once the user pauses.
  //
  // Reading the boxes' values from the DOM at the moment the debounce *fires* is
  // unsafe: if the user collapses the exercise card (or navigates away) within the
  // 700ms window, those inputs no longer exist by the time the timer runs, both read
  // as empty, and the rest time silently gets committed as 0 - which floors to 5s.
  // Instead, snapshot both boxes' live values right now, while they definitely still
  // exist, and commit from that snapshot instead of re-querying the DOM later.
  var restEditTimers = {};
  window.scheduleRestUpdate = function(exId){
    var minEl = document.getElementById("rest-min-" + exId);
    var secEl = document.getElementById("rest-sec-" + exId);
    var snapshot = { min: minEl ? minEl.value : "", sec: secEl ? secEl.value : "" };
    if (restEditTimers[exId]) clearTimeout(restEditTimers[exId]);
    restEditTimers[exId] = setTimeout(function(){
      delete restEditTimers[exId];
      window.updateRestParts(exId, snapshot);
    }, 700);
  };

  // Drag-to-reorder for the exercise list in "edit split". Uses Pointer Events (not
  // HTML5 drag-and-drop, which mobile/touch browsers - including Instagram's in-app
  // browser - don't support) so it works the same with a mouse or a finger. The drag
  // itself is pure DOM manipulation (no render()) so the gesture isn't interrupted;
  // the reordered array is only committed to data/persist() once the finger/mouse lifts.
  var dragState = null;

  window.reorderPointerDown = function(e, dayId, exId){
    e.preventDefault();
    var row = e.currentTarget.closest(".list-item");
    var container = row.parentNode;
    var rows = Array.prototype.slice.call(container.querySelectorAll(".list-item"));
    var order = rows.map(function(r){ return r.getAttribute("data-ex-id"); });

    dragState = {
      dayId: dayId,
      rows: rows,
      order: order,
      index: order.indexOf(exId),
      target: order.indexOf(exId),
      startY: e.clientY,
      rowHeight: row.getBoundingClientRect().height
    };

    row.setPointerCapture(e.pointerId);
    row.classList.add("dragging");
    rows.forEach(function(r){ r.style.transition = "transform 150ms"; });
    row.style.transition = "none";
    row.style.zIndex = "5";

    document.addEventListener("pointermove", reorderPointerMove);
    document.addEventListener("pointerup", reorderPointerUp);
    document.addEventListener("pointercancel", reorderPointerUp);
  };

  function reorderPointerMove(e){
    if (!dragState) return;
    e.preventDefault();
    var deltaY = e.clientY - dragState.startY;
    dragState.rows[dragState.index].style.transform = "translateY(" + deltaY + "px)";

    var shift = Math.round(deltaY / dragState.rowHeight);
    var target = Math.max(0, Math.min(dragState.order.length - 1, dragState.index + shift));
    if (target === dragState.target) return;
    dragState.target = target;

    dragState.rows.forEach(function(r, i){
      if (i === dragState.index) return;
      var offset = 0;
      if (dragState.index < target && i > dragState.index && i <= target) offset = -1;
      if (dragState.index > target && i < dragState.index && i >= target) offset = 1;
      r.style.transform = offset ? "translateY(" + (offset * dragState.rowHeight) + "px)" : "";
    });
  }

  function reorderPointerUp(){
    if (!dragState) return;
    document.removeEventListener("pointermove", reorderPointerMove);
    document.removeEventListener("pointerup", reorderPointerUp);
    document.removeEventListener("pointercancel", reorderPointerUp);

    var dayId = dragState.dayId;
    var order = dragState.order;
    var newOrder = order.slice();
    var moved = newOrder.splice(dragState.index, 1)[0];
    newOrder.splice(dragState.target, 0, moved);

    dragState.rows.forEach(function(r){
      r.style.transform = "";
      r.style.transition = "";
      r.style.zIndex = "";
      r.classList.remove("dragging");
    });
    var changed = newOrder.join(",") !== order.join(",");
    dragState = null;
    if (!changed) return;

    var next = JSON.parse(JSON.stringify(data));
    var day = next.split.days.find(function(d){ return d.id === dayId; });
    var byId = {};
    day.exercises.forEach(function(ex){ byId[ex.id] = ex; });
    day.exercises = newOrder.map(function(id){ return byId[id]; });
    persist(next);
  }

  window.toggleExpand = function(exId){
    if (ui.expandedEx === exId){
      ui.expandedEx = null;
      render();
      return;
    }
    ui.expandedEx = exId;
    var ex = findExercise(exId);
    var history = getHistory(exId);
    var today = history.find(function(h){ return h.date === todayKey(); });
    var savedSets = today ? today.sets : [];
    // ex.setCount (once the user has ever changed it) is the authoritative row count -
    // otherwise fall back to how many sets exist already, or the old default of 3.
    var count = (ex && ex.setCount) ? ex.setCount : (savedSets.length || (history[0] ? history[0].sets.length : 3));
    var seed = [];
    for (var i=0;i<count;i++){
      var s = savedSets[i];
      seed.push(s ? { reps: String(s.reps), weight: String(s.weight) } : { reps:"", weight:"" });
    }
    ui.draft[exId] = seed;
    render();
  };
  window.setSetCount = function(exId, n){
    n = Math.max(1, Math.min(20, parseInt(n,10) || 1));
    var current = ui.draft[exId] || [];
    var next = [];
    for (var i=0;i<n;i++){
      next.push(current[i] || { reps:"", weight:"" });
    }
    ui.draft[exId] = next;
    render();

    // Persist the count itself so it's remembered even before any reps/weight are
    // filled in - previously this only lived in memory and was lost (guessed back to
    // a default of 3) the moment you navigated away and came back.
    var nextData = JSON.parse(JSON.stringify(data));
    var found = null;
    nextData.split.days.forEach(function(d){
      var e = d.exercises.find(function(e){ return e.id === exId; });
      if (e) found = e;
    });
    if (found) found.setCount = n;

  var draftSaveTimers = {};
  window.updateDraft = function(exId, idx, field, value){
    ui.draft[exId][idx][field] = value;
    // Auto-save (debounced) so typed reps/weight survive even if the user never
    // presses "Save Sets" and just navigates away - matches every other input in
    // the app now keeping whatever was actually typed.
    if (draftSaveTimers[exId]) clearTimeout(draftSaveTimers[exId]);
    draftSaveTimers[exId] = setTimeout(function(){
      delete draftSaveTimers[exId];
      commitDraft(exId);
    }, 900);
  };

  function commitDraft(exId){
    var rows = (ui.draft[exId] || []).filter(function(r){
      return r.reps !== "" && r.reps !== null && !isNaN(parseFloat(r.reps));
    }).map(function(r){
      return { reps: parseFloat(r.reps), weight: r.weight === "" ? 0 : parseFloat(r.weight) || 0 };
    });
    var date = todayKey();
    var history = getHistory(exId);
    var lastSession = history.find(function(h){ return h.date !== date; });
    var isNewPR = false;
    if (lastSession && rows.length){
      var lastBestWeight = Math.max.apply(null, lastSession.sets.map(function(s){ return Number(s.weight) || 0; }));
      var lastBestReps = Math.max.apply(null, lastSession.sets.map(function(s){ return Number(s.reps) || 0; }));
      var todayBestWeight = Math.max.apply(null, rows.map(function(s){ return Number(s.weight) || 0; }));
      var todayBestReps = Math.max.apply(null, rows.map(function(s){ return Number(s.reps) || 0; }));
      isNewPR = todayBestWeight > lastBestWeight || todayBestReps > lastBestReps;
    }

    var next = JSON.parse(JSON.stringify(data));
    if (!next.logs[date]) next.logs[date] = { dayId: ui.activeDayId, entries: {} };
    next.logs[date].entries[exId] = rows;
    persist(next);
    if (isNewPR) fireConfetti();
  }
  window.saveSets = function(exId){
    if (draftSaveTimers[exId]){ clearTimeout(draftSaveTimers[exId]); delete draftSaveTimers[exId]; }
    commitDraft(exId);
  };
  window.clearToday = function(exId){
    var next = JSON.parse(JSON.stringify(data));
    var date = todayKey();
    if (next.logs[date] && next.logs[date].entries){

    }

    persist(next);
  };

  window.submitChangePassword = async function(){
    var curEl = document.getElementById("pw-current");
    var newEl = document.getElementById("pw-new");
    var confirmEl = document.getElementById("pw-confirm");
    var current = curEl ? curEl.value : "";
    var next = newEl ? newEl.value : "";
    var confirm = confirmEl ? confirmEl.value : "";

    ui.pwSuccess = false;
    if (!current || !next || next.length < 6){
      ui.pwError = T("errInvalidInput");
      render();
      return;
    }
    if (next !== confirm){
      ui.pwError = T("passwordMismatch");
      render();
      return;
    }

    ui.pwBusy = true;
    ui.pwError = null;
    render();

    try {
      var res = await apiFetch("/api/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
        body: JSON.stringify({ currentPassword: current, newPassword: next })
      });
      var body = await res.json().catch(function(){ return {}; });
      ui.pwBusy = false;
      if (!res.ok){
        if (body.error === "WRONG_PASSWORD") ui.pwError = T("wrongCurrentPassword");
        else if (body.error === "INVALID_INPUT") ui.pwError = T("errInvalidInput");
        else ui.pwError = T("errGeneric");
        render();
        return;
      }
      // The server issues a fresh token (new tokenVersion) so this session stays
      // logged in while any other logged-in device/session gets invalidated.
      authToken = body.token;
      try { localStorage.setItem(TOKEN_KEY, authToken); } catch(e){}
      ui.pwSuccess = true;
      render();
    } catch(e){
      ui.pwBusy = false;
      ui.pwError = T("errGeneric");
      render();
    }
  };

    var thisWeekVolume = volumeInRange(thisWeekStart, today);
    var lastWeekVolume = volumeInRange(lastWeekStart, lastWeekEnd);

    html += '<div style="font-size:16px;font-weight:700;margin-top:4px;word-break:break-all;">' + esc(identity ? identity.value : "") + '</div>';
    html += '<div class="muted" style="margin-top:6px;">' + (identity && identity.type === "phone" ? T("accountTypePhone") : T("accountTypeEmail")) + '</div>';
    html += '</div>';

    html += '<div style="margin-top:20px;">';
    html += '<div class="sub" style="font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px;">' + T("changePasswordBtn") + '</div>';
    html += '<div style="margin-bottom:10px;">' + passwordFieldHtml("pw-current", T("currentPasswordPlaceholder"), "current-password") + '</div>';
    html += '<div style="margin-bottom:10px;">' + passwordFieldHtml("pw-new", T("newPasswordPlaceholder"), "new-password") + '</div>';
    html += '<div style="margin-bottom:10px;">' + passwordFieldHtml("pw-confirm", T("confirmNewPasswordPlaceholder"), "new-password") + '</div>';

    if (ui.pwError){
      html += '<div style="color:var(--danger);font-size:12px;margin-bottom:10px;">' + esc(ui.pwError) + '</div>';
    }
    if (ui.pwSuccess){
      html += '<div style="color:var(--accent);font-size:12px;margin-bottom:10px;">' + esc(T("passwordChanged")) + '</div>';
    }
    html += '<button class="btn-primary" style="width:100%;" ' + (ui.pwBusy ? "disabled" : "") + ' onclick="submitChangePassword()">' + (ui.pwBusy ? T("syncing") : T("savePasswordBtn")) + '</button>';
    html += '</div>';

    html += '<div class="footer-note">' + T("footer") + '</div>';
    return html;
  }

  function renderExerciseCard(ex){
    var history = getHistory(ex.id);
    var todayEntry = history.find(function(h){ return h.date === todayKey(); });
    var todaySets = todayEntry ? todayEntry.sets : [];
    var todayVolume = volumeOf(todaySets);
    var pastVolumes = history.filter(function(h){ return h.date !== todayKey(); }).map(function(h){ return volumeOf(h.sets); });
    var bestPastVolume = pastVolumes.length ? Math.max.apply(null, pastVolumes) : 0;
    var isPR = todayVolume > 0 && todayVolume > bestPastVolume;
    var barBase = Math.max(bestPastVolume, todayVolume, 1);
    var barPct = Math.min(100, (todayVolume / barBase) * 100);
    var lastSession = history.find(function(h){ return h.date !== todayKey(); });
    var expanded = ui.expandedEx === ex.id;

    var html = '<div class="card">';
    html += '<button class="card-head" onclick="toggleExpand(\'' + ex.id + '\')">';
    html += '<div class="card-head-top"><span>' + esc(ex.name) + '</span><div style="display:flex; align-items:center; gap:8px;"><button class="btn-unit-toggle" onclick="event.stopPropagation(); toggleExerciseUnit(\'' + ex.id + '\')">' + esc(getExerciseUnit(ex.id)) + '</button><span class="muted">' + (expanded ? "▲" : "▼") + '</span></div></div>';
    if (lastSession){
      html += '<div class="muted">' + T("last") + ' ' + lastSession.sets.map(function(s){ return s.reps + '×' + s.weight + getExerciseUnit(ex.id); }).join(", ") + '</div>';
    }
    if (todayVolume > 0 || bestPastVolume > 0){
      html += '<div><div class="bar-track"><div class="bar-fill ' + (isPR ? "pr" : "") + '" style="width:' + barPct + '%;"></div></div>';
      if (isPR) html += '<div class="pr-label">' + T("newPR") + '</div>';
      html += '</div>';
    }
    html += '</button>';

    if (history.length > 0){
      html += '<div class="chart-wrap"><canvas id="chart-' + ex.id + '"></canvas></div>';
    }

    if (expanded){
      var draft = ui.draft[ex.id] || [];
      var restSeconds = ex.restSeconds || 90;
      var restMin = Math.floor(restSeconds / 60);
      var restSecPart = restSeconds % 60;
      html += '<div class="card-body">';

      html += '<div class="rest-row">';
      html += '<label class="muted" style="flex:0 0 auto;">' + T("restLabel") + '</label>';
      html += '<input type="number" min="0" max="59" id="rest-min-' + ex.id + '" value="' + restMin + '" oninput="scheduleRestUpdate(\'' + ex.id + '\')" />';
      html += '<span class="muted">' + T("restMinUnit") + '</span>';
      html += '<input type="number" min="0" max="59" id="rest-sec-' + ex.id + '" value="' + restSecPart + '" oninput="scheduleRestUpdate(\'' + ex.id + '\')" />';
      html += '<span class="muted">' + T("restSecUnit") + '</span>';
      html += '<button id="rest-btn-' + ex.id + '" class="btn-ghost" onclick="startRest(\'' + ex.id + '\')">' + T("restStart") + '</button>';
      html += '<span id="rest-display-' + ex.id + '" class="rest-display">' + formatRestTime(restSeconds) + '</span>';
      html += '</div>';

      html += '<div class="row" style="align-items:center;margin-bottom:12px;">';
      html += '<label class="muted" style="flex:0 0 auto;">' + T("setsLabel") + '</label>';
      html += '<input type="number" min="1" max="20" value="' + draft.length + '" style="width:70px;" onchange="setSetCount(\'' + ex.id + '\', this.value)" />';
      html += '</div>';

      draft.forEach(function(row, idx){
        html += '<div class="set-row">';
        html += '<span class="set-num">' + (idx+1) + '</span>';
        html += '<input type="number" inputmode="numeric" placeholder="' + esc(T("repsPlaceholder")) + '" value="' + esc(row.reps) + '" oninput="updateDraft(\'' + ex.id + '\',' + idx + ',\'reps\',this.value)" />';
        html += '<input type="number" inputmode="decimal" placeholder="' + esc(T("weightPlaceholder")) + ' (' + getExerciseUnit(ex.id) + ')" value="' + esc(row.weight) + '" oninput="updateDraft(\'' + ex.id + '\',' + idx + ',\'weight\',this.value)" />';
        html += '</div>';
      });

      html += '<div class="row" style="margin-top:6px;">';
      html += '<button class="btn-primary" style="flex:1;" onclick="saveSets(\'' + ex.id + '\')">' + T("saveSets") + '</button>';
      if (todaySets.length > 0){
        html += '<button class="btn-ghost" onclick="clearToday(\'' + ex.id + '\')">' + T("clearToday") + '</button>';
      }
      html += '</div>';
      if (data.adminComments && data.adminComments[ex.id]) {
        var comment = data.adminComments[ex.id];
        if (comment && comment.text && comment.text.trim()) {
          html += '<div class="admin-comment" style="margin-top: 12px; padding: 8px 12px; background: var(--surface-raised); border-radius: 6px; font-size: 13px; line-height: 1.4; border-left: 3px solid var(--accent);">';
          html += '<span style="font-weight: 600; color: var(--text);">IbTheLifter commented:</span> ' + esc(comment.text);
          html += '</div>';
        }
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function attachMainFocusHandlers(){
    var liveInput = document.getElementById("live-ex-input");
    if (liveInput){
      liveInput.addEventListener("keydown", function(e){
        if (e.key === "Enter"){
          e.preventDefault();
          var row = liveInput.closest(".row");
          var btn = row ? row.querySelector("button") : null;
          if (btn) btn.click();
        }
      });
      var activeDay = data.split.days.find(function(d){ return d.id === ui.activeDayId; });
      if (activeDay) attachAutocomplete(liveInput, suggestionsForDayName(activeDay.name));
    }
    enableScrollIntoViewOnFocus(app);
  }

  (async function init(){
    var storedLang = await storageGet(LANG_KEY);
    if (storedLang === "en" || storedLang === "ar") lang = storedLang;
    applyDirection();

    var storedToken = null;
    try {
      storedToken = localStorage.getItem(TOKEN_KEY);
      var storedIdentity = localStorage.getItem(IDENTITY_KEY);
      if (storedIdentity) identity = JSON.parse(storedIdentity);
    } catch(e){}

    if (storedToken){
      authToken = storedToken;
      var fresh = await fetchServerData();
      if (fresh && fresh.unauthorized){
        // The server explicitly rejected this token - genuinely logged out.
        authToken = null;
        try { localStorage.removeItem(TOKEN_KEY); } catch(e){}
        ui.stage = "auth-choice";
      } else if (fresh){
        dataEtag = fresh.etag;
        data = (fresh.data && fresh.data.split) ? fresh.data : null;
        if (data){
          storageSet(STORAGE_KEY, JSON.stringify(data));
          ui.activeDayId = data.split.days[0] ? data.split.days[0].id : null;
        }
        ui.stage = data ? "main" : "onboard-choose";
      } else {
        // Couldn't reach the server (network hiccup) - do NOT log out or wipe
        // anything. Fall back to the last locally cached copy so the app still
        // works, and keep the token so syncs can resume once the network is back.
        var cachedRaw = await storageGet(STORAGE_KEY);
        if (cachedRaw){
          try {
            data = JSON.parse(cachedRaw);
            ui.activeDayId = data.split && data.split.days && data.split.days[0] ? data.split.days[0].id : null;
          } catch(e){ data = null; }
        }
        ui.stage = data ? "main" : "onboard-choose";
      }
    } else {
      ui.stage = "auth-choice";
    }
    render();

  window.getExerciseUnit = function(exId) {
    if (!data.exerciseUnits) data.exerciseUnits = {};
    return data.exerciseUnits[exId] || data.unit || "kg";
  };

  window.toggleExerciseUnit = function(exId) {
    if (!data.exerciseUnits) data.exerciseUnits = {};
    var current = getExerciseUnit(exId);
    data.exerciseUnits[exId] = current === "kg" ? "lbs" : "kg";
    persist(data);
  };

  window.showAdminPanel = async function(){
    ui.stage = "admin";
    ui.adminLoading = true;
    ui.adminUsers = [];
    ui.adminSelectedUser = null;
    render();
    try {
      var res = await apiFetch("/api/admin", {
        headers: { "Authorization": "Bearer " + authToken }
      });
      if (res.ok) {
        var body = await res.json();
        ui.adminUsers = body.users || [];
      }
    } catch(e) {}
    ui.adminLoading = false;
    render();
  };

  window.selectAdminUser = function(userPathname) {
    var user = ui.adminUsers.find(function(u){ return u.pathname === userPathname; });
    ui.adminSelectedUser = user || null;
    render();
  };

  window.sendAdminComment = async function(userPathname, exId, textOverride) {
    var input = document.getElementById("admin-comment-input-" + exId);
    var text = textOverride !== undefined ? textOverride : (input ? input.value : "");
    try {
      var res = await apiFetch("/api/admin", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + authToken },
        body: JSON.stringify({
          userPathname: userPathname,
          exerciseId: exId,
          commentText: text
        })
      });
      if (res.ok) {
        var selectedUser = ui.adminUsers.find(function(u){ return u.pathname === userPathname; });
        if (selectedUser) {
          if (!selectedUser.data.adminComments) selectedUser.data.adminComments = {};
          selectedUser.data.adminComments[exId] = { text: text, timestamp: new Date().toISOString() };
        }
        alert(text === "" ? "Comment deleted successfully!" : "Comment sent successfully!");
        render();
      } else {
        alert("Failed to send comment.");
      }
    } catch(e) {
      alert("Error sending comment.");
    }
  };

  window.renderAdminPanel = function() {
    var html = '<div class="header-row">';
    html += '<div class="brand-row"><span class="brand-text">Admin Panel</span></div>';
    html += '<div class="top-actions">';
    html += '<button class="btn-ghost" onclick="backToMain()">Back to App</button>';
    html += '</div></div>';

    if (ui.adminLoading) {
      html += '<div style="text-align:center; padding: 40px;" class="muted">Loading users list...</div>';
      return html;
    }

    html += '<div class="row" style="margin-top: 16px;">';
    html += '<h2 style="font-size: 20px; font-weight: bold; color: var(--text);">Registered Users (' + ui.adminUsers.length + ')</h2>';
    html += '</div>';

    if (!ui.adminUsers.length) {
      html += '<div class="card" style="padding: 20px; text-align:center;" class="muted">No registered users found.</div>';
      return html;
    }

    // List of Users
    html += '<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">';
    ui.adminUsers.forEach(function(user) {
      var isSelected = ui.adminSelectedUser && ui.adminSelectedUser.pathname === user.pathname;
      var labelName = user.fullName || "Unnamed User";
      html += '<div class="card" style="padding: 12px; cursor: pointer; border: ' + (isSelected ? '1px solid var(--accent)' : '1px solid var(--line)') + '" onclick="selectAdminUser(\'' + user.pathname + '\')">';
      html += '<div style="display:flex; justify-content: space-between; align-items: center;">';
      html += '<div>';
      html += '<div style="font-weight: 600; color: var(--text);">' + esc(labelName) + '</div>';
      html += '<div class="muted" style="font-size: 12px;">' + esc(user.identifier) + ' (' + esc(user.identifierType) + ')</div>';
      html += '</div>';
      html += '<span class="muted">' + (isSelected ? "▲" : "▼") + '</span>';
      html += '</div>';
      html += '</div>';
    });
    html += '</div>';

    // Inspected User details
    if (ui.adminSelectedUser) {
      var selUser = ui.adminSelectedUser;
      var nameLabel = selUser.fullName || "Unnamed User";
      html += '<div style="margin-top: 24px; border-top: 2px solid var(--line); padding-top: 16px;">';
      html += '<h3 style="font-size: 18px; font-weight: bold; color: var(--text); margin-bottom: 12px;">Workout logs for: ' + esc(nameLabel) + '</h3>';

      var userLogs = (selUser.data && selUser.data.logs) || {};
      var dates = Object.keys(userLogs).sort(function(a,b){ return b.localeCompare(a); }); // newest first

      if (!dates.length) {
        html += '<div class="card" style="padding: 20px; text-align: center;" class="muted">This user has no logged workouts yet.</div>';
      } else {
        dates.forEach(function(dt) {
          html += '<div class="card" style="padding: 14px; margin-bottom: 12px;">';
          html += '<div style="font-weight: bold; margin-bottom: 10px; color: var(--accent);">' + esc(dt) + '</div>';
          
          var entries = userLogs[dt].entries || {};
          var entriesKeys = Object.keys(entries);
          
          if (!entriesKeys.length) {
            html += '<div class="muted">No exercises entered.</div>';
          } else {
            entriesKeys.forEach(function(exId) {
              // Find exercise name in split config if possible, fallback to exId
              var exName = exId;
              if (selUser.data.split && selUser.data.split.days) {
                selUser.data.split.days.forEach(function(d){
                  var matching = d.exercises.find(function(ex){ return ex.id === exId; });
                  if (matching) exName = matching.name;
                });
              }
              
              var sets = Array.isArray(entries[exId]) ? entries[exId] : (entries[exId].sets || []);
              html += '<div style="margin-top: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px;">';
              html += '<div style="font-weight: 600; color: var(--text);">' + esc(exName) + '</div>';
              
              // Render weight units
              var exUnit = (selUser.data.exerciseUnits && selUser.data.exerciseUnits[exId]) || selUser.data.unit || "kg";
              
              html += '<table style="width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px;">';
              html += '<thead><tr style="text-align:left; border-bottom: 1px solid var(--line);"><th style="padding: 4px;">Set</th><th style="padding: 4px;">Reps</th><th style="padding: 4px;">Weight (' + exUnit + ')</th></tr></thead>';
              html += '<tbody>';
              sets.forEach(function(s, idx) {
                html += '<tr>';
                html += '<td style="padding: 4px;">' + (idx+1) + '</td>';
                html += '<td style="padding: 4px;">' + esc(s.reps) + '</td>';
                html += '<td style="padding: 4px;">' + esc(s.weight) + '</td>';
                html += '</tr>';
              });
              html += '</tbody></table>';

              // Admin Comment Box
              var existingComment = (selUser.data.adminComments && selUser.data.adminComments[exId]) ? selUser.data.adminComments[exId].text : "";
              html += '<div style="margin-top: 10px; display:flex; flex-direction:column; gap: 6px;">';
              html += '<input type="text" id="admin-comment-input-' + exId + '" value="' + esc(existingComment) + '" placeholder="Leave a comment on this exercise..." style="width: 100%; padding: 6px; font-size: 13px;" />';
              html += '<div style="display:flex; align-items:center; gap:8px;">';
              html += '<button class="btn-primary" style="padding: 4px 10px; font-size: 12px;" onclick="sendAdminComment(\'' + selUser.pathname + '\', \'' + exId + '\')">Send Comment</button>';
              if (existingComment && existingComment.trim()) {
                html += '<button class="btn-ghost" style="padding: 4px 10px; font-size: 12px; color: var(--accent);" onclick="sendAdminComment(\'' + selUser.pathname + '\', \'' + exId + '\', \'\')">Delete Comment</button>';
              }
              html += '</div>';
              html += '</div>';

              html += '</div>';
            });
          }
          html += '</div>';
        });
      }
      html += '</div>';
    }

    return html;
  }
  })();
})();
</script>
</body>
</html>
